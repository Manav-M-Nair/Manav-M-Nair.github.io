baseURL = "https://example.org/"
defaultContentLanguage = "en"
# Automatically generate robots.txt
enableRobotsTXT = true

locale = "en"
theme = "gokarna"
title = "Manav M Nair"

[params]
  avatarAltText = "avatar"
  avatarSize = "size-m"
  avatarURL = "/images/website_pfp.jpg"
  description = "Every question — from the smallest atoms to the largest galaxies, must have a definable answer and I intend to find those answers..."
  footer = "Manav M Nair"

  # Social icons MUST come at the bottom of [params]
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ShinyHunter2855"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/manav-m-nair-424499272/"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/Manav_M_Nair"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:manavmnair25@iisertvm.ac.in"



  customHeadHTML = """
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
          ],
          // • rendering keys, e.g.:
          throwOnError : false
        });
      });
    </script>
  """

  description = "Every question — from the smallest atoms to the largest galaxies, must have a definable answer and I intend to find those answers..."
  footer = "Manav M Nair"
  metaKeywords = ["blog", "gokarna", "hugo"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages


[menu]
  [[menu.main]]
    # Display name
    name = "Posts"

    # Relative URL slug (appended to baseURL)
    url = "/posts/"

    # Lower weights are listed first in the menu (leftmost); higher weights are
    # listed last in the menu (rightmost)
    weight = 1


    [[menu.main]]
      name = "Uploads"
      url = "/uploads/"
      weight = 2

  [[menu.main]]
    # Unique identifiers are required for menu entries without a name property,
    # or for menu entries which re-use a name
    identifier = "github"

    # Absolute URL to external resource
    url = "https://github.com"
    weight = 3

    # Surround the menu entry (or name) with HTML content, such as Feather
    # icons: https://feathericons.com
    pre = "<span data-feather='github'></span>"
    post = ""

    [markup]
      [markup.goldmark]
        [markup.goldmark.renderer]
          unsafe = true
